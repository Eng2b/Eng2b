</radialGradient>
<radialGradient id="pglowB" cx=".1" cy="1" r=".6">
  <stop offset="0" stop-color="#4F7BFF" stop-opacity=".2"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/>
</radialGradient>
<linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#B7A5FF" stop-opacity="0"/>
  <stop offset=".5" stop-color="#B7A5FF" stop-opacity=".55"/>
  <stop offset="1" stop-color="#B7A5FF" stop-opacity="0"/>
</linearGradient>
