<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d">
<title id="t">Engineering mindset as a commit history</title>
<desc id="d">Engineering principles shown as a git log: understand: Understand the problem before writing code. Who uses it, what they need, and what can go wrong. model: Design the data before the features. Entities, relationships and constraints come first. build: Write code someone else can read. Small functions, clear names, honest comments. verify: Validate assumptions. Handle errors. Check inputs, test the edges, fail with clear messages. iterate: Ship something practical, then improve it. Feedback over perfection.</desc>
