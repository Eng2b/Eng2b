<title id="t">Learning roadmap</title>
<desc id="d">Learning roadmap, currently learning: Frontend craft: components, accessibility, React fundamentals; Reliable backend APIs: FastAPI, authentication, validation, error handling; Database design &amp; SQL: query design, indexing basics, PostgreSQL; Software architecture fundamentals: layers, boundaries, separation of concerns; Odoo &amp; ERP concepts: custom modules, ORM, business workflows; Testing &amp; engineering practice: unit tests, code review, version control habits</desc>
